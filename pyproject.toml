[project]
name = "talos"
version = "0.1.0"
description = "AI Agent 脚手架工具 — 快速生成基于异步任务队列的 AI Agent 项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15.0",
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
talos = "talos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
